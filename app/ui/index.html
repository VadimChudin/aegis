<!doctype html>
<html lang="en" data-theme="glass-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEGIS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="app">
      <header class="chrome">
        <div class="chrome-left">
          <div class="brand">
            <img class="brand-mark" src="assets/icon.png" alt="" />
            <div class="brand-name">AEGIS</div>
          </div>
          <div class="chrome-picks">
            <div class="hdr-slot" id="hdrBroker"></div>
            <div class="hdr-slot" id="hdrTf"></div>
          </div>
        </div>
        <div class="chrome-center">
          <div class="broker-dots" id="brokerDots"></div>
          <button class="density-open" id="btnDensities" type="button" title="Density screener">Densities</button>
        </div>
        <div class="chrome-right">
          <button class="ghost" id="btnAiStop" type="button" title="Остановить AI Paper; текущие Paper-стопы остаются под контролем">Стоп AI</button>
          <span class="lamp" id="feedLamp" data-on="0" title="Offline"></span>
          <button class="cta" id="btnBrokers" type="button" data-i18n>Brokers</button>
          <button class="ghost-round" id="btnMenu" type="button" title="Menu" data-i18n-title>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="6" cy="12" r="1.6" />
              <circle cx="12" cy="12" r="1.6" />
              <circle cx="18" cy="12" r="1.6" />
            </svg>
          </button>
        </div>
      </header>

      <div class="browser-notice" id="browserNotice" role="status" hidden></div>

      <main class="stage">
        <aside class="rail glass" id="rail">
          <button class="rail-item on" data-panel="chart" type="button"><span class="ico">⌂</span><span>AEGIS</span></button>
          <button class="rail-item" data-panel="brokers" type="button"><span class="ico">▣</span><span data-i18n>Brokers</span></button>
          <button class="rail-item" data-panel="theme" type="button"><span class="ico">⚙</span><span data-i18n>Settings</span></button>
          <button class="rail-item" data-panel="ai" type="button"><span class="ico">✦</span><span>AI · Paper</span></button>
          <div class="rail-sep"></div>
          <div class="rail-label" data-i18n>Strategies</div>
          <div id="strategyList" class="strategy-list"></div>
        </aside>

        <section class="chart-wrap glass">
          <div class="chart-frame">
            <div class="chart-legend">
              <span class="sym" id="legendSym">XAU</span>
              <span id="legendMeta">No broker</span>
              <span class="px" id="legendPx"></span>
            </div>
            <div id="chart"></div>
            <div class="bt-bar" id="btBar" hidden>
              <span id="btBarText">Backtest</span>
              <button type="button" class="ghost sm" id="btBarLive" data-i18n>Back to live</button>
            </div>
            <div class="chart-empty" id="empty">
              <div class="box">
                <div class="brand-row" id="emptyIcons"></div>
                <h3 id="emptyTitle">No broker connected</h3>
                <p id="emptyText">AEGIS shows gold only from a broker you are connected to.</p>
                <button class="ok" id="emptyConnect" type="button" data-i18n>Connect a broker</button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="dock glass">
        <div class="stat"><span data-i18n>Brokers</span><strong id="statBrokers">0 / 3</strong></div>
        <div class="stat"><span data-i18n>Chart</span><strong id="statChart">—</strong></div>
        <div class="stat"><span data-i18n>Last</span><strong id="statLast">—</strong></div>
        <div class="log" id="log"></div>
      </footer>
    </div>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <aside class="sheet glass" id="sheet" hidden>
      <button class="row" data-open="brokers" type="button"><span data-i18n>Brokers</span><span class="row-ico">▣</span></button>
      <button class="row" data-open="theme" type="button"><span data-i18n>Settings</span><span class="row-ico">▤</span></button>
      <button class="row danger" id="sheetClose" type="button"><span data-i18n>Close</span><span class="row-ico">✕</span></button>
    </aside>

    <section class="panel glass" id="panel" hidden>
      <header class="panel-h">
        <h2 id="panelTitle">Settings</h2>
        <button class="orb sm" id="panelClose" type="button" aria-label="Close">✕</button>
      </header>
      <div id="panelBody"></div>
    </section>

    <script src="vendor/lightweight-charts.standalone.production.js"></script>
    <script src="i18n.js"></script>
    <script src="i18n-dict.js"></script>
    <script src="structural-i18n.js"></script>
    <script src="app.js"></script>
    <script src="bounce.js"></script>
    <script src="structural.js"></script>
    <script src="ai.js"></script>
    <link rel="stylesheet" href="ai.css">
  </body>
</html>
