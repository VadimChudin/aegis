[workspace]
resolver = "2"
members = ["crates/aegis-core", "app/src-tauri"]

[workspace.package]
version = "0.7.0-beta.3"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aegis-core = { path = "crates/aegis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
